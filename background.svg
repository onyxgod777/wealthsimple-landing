<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f0b"/>
      <stop offset="0.5" stop-color="#04150a"/>
      <stop offset="1" stop-color="#02230f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.8" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#16a34a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow1)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <!-- rising bar chart / candlesticks (money) -->
  <g stroke="#4ade80" stroke-opacity="0.20" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M180 800 h40 m20 0 v-70 h40 m20 0 v-120 h40 m20 0 v-30 h40 m20 0 v-160 h40 m20 0 v-60 h40 m20 0 v-200 h40 m20 0 v-90 h40"/>
  </g>

  <!-- dollar-sign rings -->
  <g stroke="#22c55e" stroke-opacity="0.16" fill="none" stroke-width="2.5">
    <circle cx="1340" cy="180" r="86"/>
    <circle cx="1340" cy="180" r="54"/>
    <circle cx="300" cy="230" r="64"/>
    <circle cx="1420" cy="760" r="70"/>
  </g>

  <!-- floating coins (green circles) -->
  <g fill="#22c55e" fill-opacity="0.06">
    <circle cx="1180" cy="880" r="46"/>
    <circle cx="90" cy="620" r="38"/>
    <circle cx="1520" cy="420" r="30"/>
  </g>

  <!-- dollar signs $ -->
  <g fill="#4ade80" fill-opacity="0.12" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="middle">
    <text x="300" y="250" font-size="120">$</text>
    <text x="1340" y="205" font-size="110">$</text>
    <text x="1420" y="790" font-size="96">$</text>
    <text x="820" y="150" font-size="70">$</text>
    <text x="1160" y="680" font-size="60">$</text>
  </g>

  <!-- subtle $ watermark -->
  <g fill="#22c55e" fill-opacity="0.05" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="middle">
    <text x="500" y="430" font-size="46">$</text>
    <text x="1040" y="360" font-size="40">$</text>
    <text x="150" y="150" font-size="52">$</text>
    <text x="1250" y="560" font-size="40">$</text>
  </g>
</svg>
